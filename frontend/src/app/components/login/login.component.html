<main class="wrap">
  <mat-card>
    <mat-card-header><mat-card-title>Login</mat-card-title></mat-card-header>
    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="submit()">
        <mat-form-field>
          <mat-label>User ID</mat-label>
          <input matInput formControlName="userId" autocomplete="username" />
        </mat-form-field>
        <mat-form-field>
          <mat-label>Password</mat-label>
          <input matInput [type]="showPassword() ? 'text' : 'password'" formControlName="password" autocomplete="current-password" />
          <button mat-icon-button matSuffix type="button" (click)="showPassword.set(!showPassword())"
            [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'">
            <mat-icon>{{ showPassword() ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
        </mat-form-field>
        <mat-form-field>
          <mat-label>Role</mat-label>
          <mat-select formControlName="role">
            <mat-option value="user">General User</mat-option>
            <mat-option value="admin">Admin</mat-option>
          </mat-select>
        </mat-form-field>

        @if (error()) { <p class="error" role="alert">{{ error() }}</p> }

        <button mat-flat-button type="submit" [disabled]="form.invalid || loading()">
          {{ loading() ? 'Signing in…' : 'Login' }}
        </button>
      </form>
      <p class="hint">Demo: admin / admin123 or user / user123</p>
    </mat-card-content>
  </mat-card>
</main>
