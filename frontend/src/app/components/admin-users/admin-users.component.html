<mat-toolbar color="primary">
  <span>MPloyChek</span>
  <span class="spacer"></span>
  <a mat-button routerLink="/dashboard">Records</a>
  <button mat-button (click)="auth.logout()">Log out</button>
</mat-toolbar>

<main class="page">
  <mat-card>
    <mat-card-header>
      <mat-card-title>{{ editingId() ? 'Edit user' : 'Add user' }}</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <form class="grid" [formGroup]="form" (ngSubmit)="save()">
        <mat-form-field>
          <mat-label>User ID</mat-label>
          <input matInput formControlName="userId" />
        </mat-form-field>
        <mat-form-field>
          <mat-label>Name</mat-label>
          <input matInput formControlName="name" />
        </mat-form-field>
        <mat-form-field>
          <mat-label>{{ editingId() ? 'New password (optional)' : 'Password' }}</mat-label>
          <input matInput type="password" formControlName="password" autocomplete="new-password" />
        </mat-form-field>
        <mat-form-field>
          <mat-label>Role</mat-label>
          <mat-select formControlName="role">
            <mat-option value="user">General User</mat-option>
            <mat-option value="admin">Admin</mat-option>
          </mat-select>
        </mat-form-field>
        <div class="actions">
          <button mat-flat-button type="submit" [disabled]="form.invalid">{{ editingId() ? 'Save changes' : 'Add user' }}</button>
          @if (editingId()) { <button mat-button type="button" (click)="reset()">Cancel</button> }
        </div>
      </form>
    </mat-card-content>
  </mat-card>

  <mat-card>
    <div class="table-wrap">
      <table mat-table [dataSource]="users()">
        <ng-container matColumnDef="userId">
          <th mat-header-cell *matHeaderCellDef>User ID</th>
          <td mat-cell *matCellDef="let u">{{ u.userId }}</td>
        </ng-container>
        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef>Name</th>
          <td mat-cell *matCellDef="let u">{{ u.name }}</td>
        </ng-container>
        <ng-container matColumnDef="role">
          <th mat-header-cell *matHeaderCellDef>Role</th>
          <td mat-cell *matCellDef="let u">{{ u.role === 'admin' ? 'Admin' : 'General User' }}</td>
        </ng-container>
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef></th>
          <td mat-cell *matCellDef="let u" class="row-actions">
            <button mat-button (click)="edit(u)">Edit</button>
            <button mat-button (click)="remove(u)" [disabled]="u.id === auth.user()?.id">Delete</button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="columns"></tr>
        <tr mat-row *matRowDef="let row; columns: columns"></tr>
      </table>
    </div>
  </mat-card>
</main>
